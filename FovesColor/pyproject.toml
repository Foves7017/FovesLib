[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "FovesColor"
version = "0.2.0"
description = "四叶的颜色管理工具"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Foves7017"}
]
requires-python = ">=3.12"

[project.urls]
Repository = "https://github.com/Foves7017/FovesLib"

[tool.hatch.build.targets.wheel]
packages = ["FovesColor"]
